[package]
name = "dock-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "dock_app"
path = "src/lib.rs"

[[bin]]
name = "dock-app"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "workspace_smoke"
path = "tests/unit/workspace_smoke.rs"

[[test]]
name = "test_registration"
path = "tests/unit/test_registration.rs"

[[test]]
name = "provenance"
path = "tests/unit/provenance.rs"

[[test]]
name = "release_boundary"
path = "tests/desktop/release_boundary.rs"

[workspace]
