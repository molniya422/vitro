<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 736" width="720" height="736" role="img" aria-label="Dock glyph set: 36 line icons on a 24 grid">
  <title>Dock glyph set v1</title>
  <desc>24 unit grid, 1.7 stroke, round caps and joins. Symbols are reusable via use href="#g-name".</desc>

  <style>
    .s { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: currentColor; stroke: none; }
    .thick { stroke-width: 2.2; }
    .label { fill: #98a1b6; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
    .cell { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 1; }
  </style>

  <defs>
    <symbol id="g-folder" viewBox="0 0 24 24">
      <g class="s"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2c.5 0 1 .2 1.4.6l1.1 1.1c.3.3.8.5 1.2.5h5.9A2.5 2.5 0 0 1 21 9.7v7.8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/></g>
