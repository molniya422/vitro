<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 184 50" width="560" height="152" role="img" aria-label="Tooltip, dark">
  <title>Tooltip, dark</title>
  <desc>Tooltip surface. The shadow is applied by the host at 0 6px 18px black 32 percent. 预览底仅用于单独打开时观察，接入时删除 id=preview-stage 的整组即可得到透明资产。</desc>
  <!-- 预览底：单独打开时的观察背景，接入时删除本组 -->
  <g id="preview-stage">
    <defs>
      <linearGradient id="preview-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1b2434"/>
        <stop offset="1" stop-color="#0d1119"/>
      </linearGradient>
      <radialGradient id="preview-glow" cx=".22" cy=".12" r=".85">
        <stop offset="0" stop-color="#7c9be0" stop-opacity=".18"/>
        <stop offset="1" stop-color="#7c9be0" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="-12" y="-12" width="184" height="50" fill="url(#preview-bg)"/>
    <rect x="-12" y="-12" width="184" height="50" fill="url(#preview-glow)"/>
  </g>
  <g id="asset">

  <rect width="160" height="26" rx="8" fill="#181c28" fill-opacity=".95"/>
  <rect x=".5" y=".5" width="159" height="25" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
  <path d="M1 8a7 7 0 0 1 7-7h144a7 7 0 0 1 7 7" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-width="1"/>
  </g>
</svg>
