<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="Grain texture swatch: raw tile and applied opacity">
  <title>Grain texture v1</title>
  <desc>Tileable 64px monochrome noise. Raw at 100 percent for inspection; applied at 0.25 percent over the glass tint, which is the shipping value.</desc>

  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <rect id="raw-tile" width="256" height="256" filter="url(#noise)"/>
  </defs>

  <style>
    .label { fill: #98a1b6; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 11px; }
    .title { fill: #e9edf7; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mono { fill: #7c9be0; font-family: "Cascadia Mono", Consolas, monospace; font-size: 11px; }
  </style>

  <rect width="560" height="340" fill="#0f131c"/>

  <text class="title" x="24" y="32">Grain texture · 64px tile, monochrome</text>
  <text class="label" x="24" y="52">Purpose: break the plastic look of flat alpha. Apply only on a pointer-events:none pseudo element.</text>

  <g transform="translate(24 76)">
    <rect x="0" y="0" width="256" height="256" rx="12" fill="#161a26"/>
    <g opacity="1">
      <rect width="256" height="256" rx="12" fill="#ffffff" filter="url(#noise)" opacity="0.12"/>
    </g>
    <rect x="0" y="0" width="256" height="256" rx="12" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <text class="label" x="0" y="280">raw tile, amplified to 12% for inspection</text>
  </g>

  <g transform="translate(304 76)">
    <rect x="0" y="0" width="232" height="120" rx="12" fill="#161a26"/>
    <rect x="0" y="0" width="232" height="120" rx="12" fill="#ffffff" filter="url(#noise)" opacity="0.0025"/>
    <rect x="0" y="0" width="232" height="120" rx="12" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <text class="label" x="0" y="144">shipping value</text>
    <text class="mono" x="0" y="164">--glass-grain-opacity: 0.0025</text>

    <rect x="0" y="188" width="232" height="68" rx="12" fill="rgba(255,255,255,0.03)"/>
    <text class="label" x="12" y="212">Fallback (cheaper, zero filter):</text>
    <text class="mono" x="12" y="232">radial-gradient(#fff 0.5px,</text>
    <text class="mono" x="12" y="248">transparent 0.5px) / 3px</text>
  </g>
</svg>
