<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 108 108" width="360" height="360" role="img" aria-label="Grain tile">
  <title>Grain tile</title>
  <desc>Tileable monochrome noise. Ships at 0.25 percent opacity; shown here at 25 percent for inspection. 预览底仅用于单独打开时观察，接入时删除 id=preview-stage 的整组即可得到透明资产。</desc>
  <!-- 预览底：单独打开时的观察背景，接入时删除本组 -->
  <g id="preview-stage">
    <defs>
      <linearGradient id="preview-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1b2434"/>
        <stop offset="1" stop-color="#0d1119"/>
      </linearGradient>
      <radialGradient id="preview-glow" cx=".22" cy=".12" r=".85">
        <stop offset="0" stop-color="#7c9be0" stop-opacity=".18"/>
        <stop offset="1" stop-color="#7c9be0" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="-22" y="-22" width="108" height="108" fill="url(#preview-bg)"/>
    <rect x="-22" y="-22" width="108" height="108" fill="url(#preview-glow)"/>
  </g>
  <g id="asset">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="64" height="64" filter="url(#grain)" opacity=".25"/>
  </g>
</svg>
