<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 32 32" width="256" height="256" role="img" aria-label="Running dot, light">
  <title>Running dot, light</title>
  <desc>4 px dot plus 1 px ring, drawn at 2x on an 8 unit board. Place 6 px below the icon, centred. 预览底仅用于单独打开时观察，接入时删除 id=preview-stage 的整组即可得到透明资产。</desc>
  <!-- 预览底：单独打开时的观察背景，接入时删除本组 -->
  <g id="preview-stage">
    <defs>
      <linearGradient id="preview-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#b9c2d2"/>
        <stop offset="1" stop-color="#8892a6"/>
      </linearGradient>
      <radialGradient id="preview-glow" cx=".22" cy=".12" r=".85">
        <stop offset="0" stop-color="#ffe6c9" stop-opacity=".35"/>
        <stop offset="1" stop-color="#ffd9b0" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="-12" y="-12" width="32" height="32" fill="url(#preview-bg)"/>
    <rect x="-12" y="-12" width="32" height="32" fill="url(#preview-glow)"/>
  </g>
  <g id="asset">

  <circle cx="4" cy="4" r="3" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
  <circle cx="4" cy="4" r="2.5" fill="rgba(18,23,36,0.45)"/>
  </g>
</svg>
