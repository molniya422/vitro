<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 36 104" width="125" height="360" role="img" aria-label="Dock separator">
  <title>Dock separator</title>
  <desc>1 unit hairline at 72 percent of icon height with round caps. Colour via currentColor; the host sets opacity. 预览底仅用于单独打开时观察，接入时删除 id=preview-stage 的整组即可得到透明资产。</desc>
  <!-- 预览底：单独打开时的观察背景，接入时删除本组 -->
  <g id="preview-stage">
    <defs>
      <linearGradient id="preview-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1b2434"/>
        <stop offset="1" stop-color="#0d1119"/>
      </linearGradient>
      <radialGradient id="preview-glow" cx=".22" cy=".12" r=".85">
        <stop offset="0" stop-color="#7c9be0" stop-opacity=".18"/>
        <stop offset="1" stop-color="#7c9be0" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="-12" y="-12" width="36" height="104" fill="url(#preview-bg)"/>
    <rect x="-12" y="-12" width="36" height="104" fill="url(#preview-glow)"/>
  </g>
  <g id="asset">
    <style>:root { color: #e9edf7; }</style>

  <line x1="6" y1="11.2" x2="6" y2="68.8" stroke="currentColor" stroke-opacity=".16" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
