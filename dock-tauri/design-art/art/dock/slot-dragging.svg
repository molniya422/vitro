<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -34 164 164" width="360" height="360" role="img" aria-label="Drop slot">
  <title>Drop slot</title>
  <desc>Active drop target: accent 8 percent fill plus accent 55 percent dashed edge. 预览底仅用于单独打开时观察，接入时删除 id=preview-stage 的整组即可得到透明资产。</desc>
  <!-- 预览底：单独打开时的观察背景，接入时删除本组 -->
  <g id="preview-stage">
    <defs>
      <linearGradient id="preview-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1b2434"/>
        <stop offset="1" stop-color="#0d1119"/>
      </linearGradient>
      <radialGradient id="preview-glow" cx=".22" cy=".12" r=".85">
        <stop offset="0" stop-color="#7c9be0" stop-opacity=".18"/>
        <stop offset="1" stop-color="#7c9be0" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="-34" y="-34" width="164" height="164" fill="url(#preview-bg)"/>
    <rect x="-34" y="-34" width="164" height="164" fill="url(#preview-glow)"/>
  </g>
  <g id="asset">

