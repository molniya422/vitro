<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="Dock product mark, small size variant">
  <title>Dock mark, small</title>
  <desc>Simplified mark for 16 to 32 px. Drops the three resting dots so the lifted tile and shelf stay readable.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2434"/>
      <stop offset="1" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb8ee"/>
      <stop offset="1" stop-color="#5a76bd"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#base)"/>
  <rect x="5" y="20" width="22" height="6" rx="3" fill="#ffffff" fill-opacity=".1"/>
  <path d="M5 23a3 3 0 0 1 3-3h16a3 3 0 0 1 3 3" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width=".7"/>
  <rect x="10" y="7" width="12" height="12" rx="3.6" fill="url(#tile)"/>
  <path d="M10.5 10a2.6 2.6 0 0 1 2.6-2.6h6.8a2.6 2.6 0 0 1 2.6 2.6" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width=".7"/>
</svg>
