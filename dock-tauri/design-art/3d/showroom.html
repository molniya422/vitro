<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dock · 三维资产展厅</title>
  <link rel="stylesheet" href="../tokens/material.css">
  <link rel="stylesheet" href="./showroom.css">
</head>
<body>
  <canvas id="scene" aria-label="三维资产展厅：Dock 主栏、插件磁贴、右键菜单、设置面板与品牌标记"></canvas>

  <header class="hud">
    <p class="eyebrow">DOCK · 3D ASSET SYSTEM</p>
    <h1>整套资源，立起来。</h1>
    <p class="lede">
      Dock 主栏、插件磁贴、右键菜单、设置面板与品牌标记，用同一套超椭圆、同一套玻璃材质重建。
      拖动可以从任意角度检查厚度与高光。
    </p>
  </header>

  <div class="controls">
    <button id="rotate" type="button" aria-pressed="true">自动旋转</button>
    <button id="reset" type="button">重置视角</button>
  </div>

  <p class="hint">拖动旋转 · 滚轮缩放</p>
  <footer class="meta">three.js r160 · 设计稿，非运行时</footer>

  <script src="./showroom.bundle.js"></script>
</body>
</html>
