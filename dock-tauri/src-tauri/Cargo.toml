[package]
name = "dock-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "dock_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "dock-tauri"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dev-dependencies]
tempfile = "3"
toml = "0.8"

[[test]]
name = "workspace_smoke"
path = "tests/unit/workspace_smoke.rs"

[[test]]
name = "test_registration"
path = "tests/unit/test_registration.rs"

[[test]]
name = "geometry"
path = "tests/unit/geometry.rs"

[[test]]
name = "autohide"
path = "tests/unit/autohide.rs"

[[test]]
name = "settings"
path = "tests/unit/settings.rs"

[workspace]
