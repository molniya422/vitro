<div id="vitro-mc" class="dk" data-pos="bottom" data-profile="macos">
<style>
#vitro-mc{
  --txt:#e9edf7; --mut:#98a1b6; --acc:#7fa4ff; --line:rgba(128,140,165,.25);
  --sig:cubic-bezier(0.25,0.46,0.45,0.94);
  font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--txt); font-size:14px; line-height:1.45;
}
#vitro-mc *{box-sizing:border-box; margin:0}
#vitro-mc button{font:inherit; color:inherit}
#vitro-mc .app{border-radius:18px; overflow:hidden; background:#0b0e17}
#vitro-mc.dk .app{box-shadow:0 24px 70px rgba(0,0,0,.5)}
#vitro-mc.lt .app{background:#eef1f7; color:#20242e; box-shadow:0 24px 70px rgba(30,40,70,.25)}
#vitro-mc.lt{--txt:#20242e; --mut:#5c6474; --line:rgba(60,70,95,.28)}
#vitro-mc .head{display:flex; align-items:center; gap:14px; padding:11px 16px; flex-wrap:wrap; border-bottom:1px solid var(--line)}
#vitro-mc .dots{display:flex; gap:6px} #vitro-mc .dots i{width:11px;height:11px;border-radius:50%}
#vitro-mc .dots i:first-child{background:#ff5f57}#vitro-mc .dots i:nth-child(2){background:#febc2e}#vitro-mc .dots i:nth-child(3){background:#28c840}
#vitro-mc .ttl{font-weight:500} #vitro-mc .ttl small{color:var(--mut); font-weight:400; margin-left:8px}
#vitro-mc .head .sp{flex:1}
#vitro-mc .sw{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mut); cursor:pointer; user-select:none}
#vitro-mc .sw input{appearance:none; width:32px; height:18px; border-radius:9px; background:rgba(128,140,165,.4); position:relative; cursor:pointer; transition:background .2s; margin:0}
#vitro-mc .sw input::after{content:""; position:absolute; top:2.5px; left:3px; width:13px; height:13px; border-radius:50%; background:#fff; transition:transform .2s}
#vitro-mc .sw input:checked{background:#4a8df0} #vitro-mc .sw input:checked::after{transform:translateX(13px)}
#vitro-mc .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
#vitro-mc .seg button{border:0; background:none; padding:4px 11px; font-size:12px; color:var(--mut); cursor:pointer}
#vitro-mc .seg button.on{background:var(--acc); color:#0d1220}
#vitro-mc .hbtn{border:1px solid var(--line); background:rgba(128,140,165,.12); border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer}
#vitro-mc .hbtn:hover{background:rgba(128,140,165,.22)}
/* 舞台 */
#vitro-mc .stage{position:relative; min-height:580px; overflow:hidden;
  background:radial-gradient(60% 45% at 18% 8%, rgba(63,81,180,.4), transparent 70%),
    radial-gradient(55% 50% at 85% 90%, rgba(122,59,143,.32), transparent 70%), linear-gradient(#0d1322,#080a12)}
#vitro-mc.lt .stage{background:radial-gradient(60% 45% at 18% 8%, rgba(140,160,230,.5), transparent 70%),
    radial-gradient(55% 50% at 85% 90%, rgba(210,150,190,.4), transparent 70%), linear-gradient(#dfe7f5,#c8d4e8)}
#vitro-mc .win{position:absolute; left:50%; top:34px; transform:translateX(-50%); width:min(56%,380px); height:42%;
  border-radius:12px; background:rgba(24,30,46,.85); border:1px solid rgba(255,255,255,.14); z-index:8; box-shadow:0 16px 44px rgba(0,0,0,.35)}
#vitro-mc.lt .win{background:rgba(250,251,253,.92); border-color:rgba(40,50,80,.18)}
#vitro-mc .win::before{content:""; position:absolute; inset:0 0 auto 0; height:28px; border-bottom:1px solid var(--line); border-radius:12px 12px 0 0; background:linear-gradient(rgba(255,255,255,.05),transparent)}
#vitro-mc .wbtns{position:absolute; top:7px; left:12px; display:flex; gap:7px; z-index:2}
#vitro-mc .wbtns button{border:0; background:none; padding:0; cursor:pointer}
#vitro-mc .wbtns i{width:12px; height:12px; border-radius:50%; display:block; background:#febc2e}
#vitro-mc .wcap{position:absolute; top:7px; left:50px; font-size:11px; color:var(--mut)}
#vitro-mc .win.mg{animation:mcGenie .6s cubic-bezier(.45,0,.55,1) forwards}
#vitro-mc .win.msc{animation:mcScale .5s cubic-bezier(.5,0,.9,.6) forwards}
#vitro-mc .win.msk{animation:mcSuck .4s cubic-bezier(.7,0,1,.5) forwards}
#vitro-mc .win.rev{animation-direction:reverse; animation-fill-mode:backwards}
#vitro-mc .win.minned{display:none}
@keyframes mcGenie{0%{transform:translateX(-50%) scaleY(1); filter:blur(0)}45%{transform:translateX(-50%) translateY(30%) scaleY(.32) skewX(10deg); filter:blur(1px)}100%{transform:translate(calc(-50% + var(--dx,0px))) translateY(var(--dy,300px)) scaleY(.05) skewX(0); filter:blur(3px); opacity:.15}}
@keyframes mcScale{0%{transform:translateX(-50%) scale(1); opacity:1}100%{transform:translate(calc(-50% + var(--dx,0px))) translateY(var(--dy,300px)) scale(.04); opacity:0}}
@keyframes mcSuck{0%{transform:translateX(-50%) scale(1) rotate(0); transform-origin:18% 100%}100%{transform:translate(calc(-50% + var(--dx,0px))) translateY(var(--dy,300px)) scale(.03) rotate(-14deg); transform-origin:18% 100%; opacity:0}}
#vitro-mc .hint{position:absolute; right:14px; top:14px; z-index:15; max-width:320px; padding:7px 11px; border-radius:11px; font-size:12px; color:#cfe0ff;
  background:rgba(20,26,40,.6); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.12)}
#vitro-mc.lt .hint{color:#26314a; background:rgba(255,255,255,.65); border-color:rgba(60,70,100,.2)}
#vitro-mc .hint b{display:block; font-size:10.5px; color:var(--mut); font-weight:500}
#vitro-mc .ezb{position:absolute; left:0; right:0; bottom:0; height:12px; z-index:24; opacity:0}
#vitro-mc[data-pos="left"] .ezb{left:0; top:0; bottom:0; right:auto; width:12px; height:auto}
#vitro-mc[data-pos="right"] .ezb{right:0; top:0; bottom:0; left:auto; width:12px; height:auto}
/* Dock:四层材质,无外描边无外投影 */
#vitro-mc .dockwrap{position:absolute; z-index:20; display:flex;
  transition:transform calc(.2s*var(--ahmod,1)) cubic-bezier(.25,.46,.45,.94), opacity calc(.2s*var(--ahmod,1))}
#vitro-mc[data-pos="bottom"] .dockwrap{left:0; right:0; bottom:14px; justify-content:center}
#vitro-mc[data-pos="left"] .dockwrap{top:0; bottom:0; left:12px; align-items:center}
#vitro-mc[data-pos="right"] .dockwrap{top:0; bottom:0; right:12px; align-items:center}
#vitro-mc.ah[data-pos="bottom"] .dockwrap{transform:translateY(110%); opacity:0}
#vitro-mc.ah[data-pos="left"] .dockwrap{transform:translateX(-110%); opacity:0}
#vitro-mc.ah[data-pos="right"] .dockwrap{transform:translateX(110%); opacity:0}
#vitro-mc .dock{display:flex; align-items:flex-end; gap:8px; padding:10px 16px; position:relative;
  backdrop-filter:blur(20px) saturate(1.10);
  background:rgba(255,255,255,.18)}
#vitro-mc.dk .dock{backdrop-filter:blur(22px) saturate(1.08); background:rgba(0,0,0,.25)}
#vitro-mc .dock::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:.003;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
#vitro-mc .dock::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(0,0,0,.10)}
#vitro-mc.dk .dock::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.15), inset 0 -1px 0 rgba(0,0,0,.15)}
#vitro-mc[data-pos="left"] .dock,#vitro-mc[data-pos="right"] .dock{flex-direction:column; align-items:center; gap:8px; padding:10px 16px}
#vitro-mc.no-blur .dock{backdrop-filter:none}
#vitro-mc.no-fill .dock{background:none}
#vitro-mc.no-grain .dock::before{display:none}
#vitro-mc.no-hair .dock::after{display:none}
#vitro-mc.hc .dock{background:rgba(255,255,255,.8)} #vitro-mc.dk.hc .dock{background:rgba(10,12,18,.86)}
#vitro-mc .v-sep{width:1px; align-self:stretch; margin:6px 4px; background:rgba(128,140,165,.5)}
#vitro-mc.hc .v-sep{width:2px}
#vitro-mc[data-pos="left"] .v-sep,#vitro-mc[data-pos="right"] .v-sep{width:auto; height:1px; align-self:stretch; margin:4px 6px}
#vitro-mc .spacer{width:22px; align-self:stretch}
#vitro-mc .v-ic{appearance:none; border:0; background:none; padding:0; position:relative; width:var(--isz,48px); height:var(--isz,48px); cursor:pointer}
#vitro-mc .v-ic .ico{display:block; width:100%; height:100%; transition:transform calc(var(--mo,200)*1ms) var(--sig), filter .2s}
#vitro-mc .dock.settle .v-ic .ico{transition-duration:calc(var(--mo2,250)*1ms)}
#vitro-mc .v-ic svg{width:100%; height:100%; display:block; border-radius:20%}
#vitro-mc .v-ic:hover .ico{filter:brightness(1.05)}
#vitro-mc .v-ic.launching .ico{filter:brightness(1.10)}
#vitro-mc .v-ic.dis{filter:saturate(0); opacity:.7; pointer-events:none}
#vitro-mc .ico.bounce{animation:mcBounce .8s cubic-bezier(.45,0,.55,1)}
@keyframes mcBounce{0%,100%{transform:none}18%{transform:translateY(-12px)}42%{transform:translateY(0)}62%{transform:translateY(-6px)}82%{transform:translateY(0)}92%{transform:translateY(-1.5px)}}
#vitro-mc .dot{position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); width:4px; height:4px; border-radius:50%;
  background:rgba(0,0,0,.4); opacity:0; transition:opacity .3s}
#vitro-mc.dk .dot{background:rgba(255,255,255,.6)}
#vitro-mc.hc .dot{width:6px; height:6px}
#vitro-mc[data-pos="left"] .dot,#vitro-mc[data-pos="right"] .dot{left:auto; right:-6px; top:50%; bottom:auto; transform:translateY(-50%)}
#vitro-mc .v-ic.run .dot{opacity:1}
#vitro-mc .badge{position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 4px; border-radius:9px;
  background:linear-gradient(180deg,#ff6a6a,#e8342e); color:#fff; font-size:11px; line-height:15px; font-weight:600; text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45); opacity:0; transform:scale(.5); transition:all .25s}
#vitro-mc .v-ic.bd .badge{opacity:1; transform:scale(1)}
#vitro-mc .stack-hot .ico{transform:scale(1.1); opacity:.75; filter:brightness(.92)}
#vitro-mc .minthumb{width:56px; height:38px; border-radius:8px; border:1px solid var(--line); background:rgba(128,140,165,.25);
  display:flex; align-items:center; justify-content:center; font-size:9.5px; color:var(--mut); cursor:pointer; align-self:center}
#vitro-mc .minthumb:hover{background:rgba(128,140,165,.4)}
/* 自定义 macOS Tooltip */
#vitro-mc .tip{position:absolute; z-index:40; padding:4px 8px; border-radius:8px; font-size:13px; font-weight:500; white-space:nowrap;
  background:rgba(28,34,50,.78); backdrop-filter:blur(16px); color:#f0f4fc; border:1px solid rgba(255,255,255,.14);
  opacity:0; transform:translateY(6px); pointer-events:none;
  transition:opacity .15s var(--sig), transform .15s var(--sig)}
#vitro-mc.lt .tip{background:rgba(250,251,253,.85); color:#1d2333; border-color:rgba(40,50,80,.16)}
#vitro-mc .tip.on{opacity:1; transform:translateY(0)}
#vitro-mc[data-pos="left"] .tip,#vitro-mc[data-pos="right"] .tip{transform:translateX(6px)}
#vitro-mc[data-pos="left"] .tip.on,#vitro-mc[data-pos="right"] .tip.on{transform:translateX(0)}
/* 堆叠:扇/网/列 */
#vitro-mc .stack{position:absolute; z-index:50}
#vitro-mc .st-it{position:absolute; width:52px; height:52px; border:0; background:none; cursor:pointer;
  transition:transform .3s var(--sig), opacity .3s var(--sig); opacity:0; transform:translate(0,0) scale(.3)}
#vitro-mc .stack.open .st-it{opacity:1}
#vitro-mc .st-it .lb{position:absolute; top:calc(100% + 4px); left:50%; transform:translateX(-50%); font-size:10.5px; color:#dbe5f5;
  background:rgba(20,26,40,.85); padding:2px 6px; border-radius:6px; white-space:nowrap}
#vitro-mc.lt .st-it .lb{color:#222b40; background:rgba(255,255,255,.9)}
#vitro-mc .st-it:hover .lb{display:block} #vitro-mc .st-it .lb{display:none}
#vitro-mc .stack.list .st-it{width:auto; height:auto; transform:translate(0,0) scale(1)!important; opacity:1;
  position:relative; display:flex; align-items:center; gap:8px; padding:5px 9px; border-radius:8px}
#vitro-mc .stack.list .st-it:hover{background:rgba(128,140,165,.2)}
#vitro-mc .stack.list .st-it svg{width:22px; height:22px}
#vitro-mc .stack.list .meta{font-size:11px; color:var(--mut)}
#vitro-mc .stackwrap{position:absolute; z-index:50; padding:8px; border-radius:14px; background:rgba(24,30,46,.72);
  backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.12); opacity:0; transform:translateY(8px); pointer-events:none;
  transition:all .25s var(--sig)}
#vitro-mc.lt .stackwrap{background:rgba(250,251,253,.8); border-color:rgba(40,50,80,.16)}
#vitro-mc .stackwrap.open{opacity:1; transform:none; pointer-events:auto}
#vitro-mc .fanbox{position:relative; width:0; height:0}
#vitro-mc .fanbox .st-it{position:absolute; left:0; top:0}
#vitro-mc .gridbox{display:grid; grid-template-columns:repeat(3,56px); gap:8px}
#vitro-mc .gridbox .st-it{position:relative; width:56px; height:56px; opacity:0; transform:scale(.3)}
#vitro-mc .listbox{display:flex; flex-direction:column; min-width:230px}
/* 启动台 */
#vitro-mc .lpad{position:absolute; inset:0; z-index:55; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  background:rgba(10,14,24,.55); backdrop-filter:blur(30px); opacity:0; visibility:hidden; transition:opacity .2s var(--sig), visibility 0s .2s}
#vitro-mc.lt .lpad{background:rgba(235,240,250,.55)}
#vitro-mc .lpad.open{opacity:1; visibility:visible; transition:opacity .2s var(--sig)}
#vitro-mc .lpad input{font:inherit; font-size:13px; width:250px; padding:7px 13px; border-radius:10px; border:1px solid var(--line);
  background:rgba(255,255,255,.14); color:inherit; outline:none; text-align:center}
#vitro-mc .lpgrid{display:grid; grid-template-columns:repeat(4,86px); gap:18px}
#vitro-mc .lp-it{border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px}
#vitro-mc .lp-it svg{width:58px; height:58px; transition:transform .2s var(--sig)}
#vitro-mc .lp-it:hover svg{transform:scale(1.08)}
#vitro-mc .lp-it span{font-size:12px; color:var(--txt)}
/* 菜单/对话框 */
#vitro-mc .menu{position:absolute; z-index:60; min-width:180px; padding:5px; border-radius:12px;
  background:rgba(28,34,50,.78); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.13);
  box-shadow:0 18px 48px rgba(0,0,0,.45); opacity:0; visibility:hidden; pointer-events:none; transform:scale(.95); transform-origin:bottom left;
  transition:all .18s var(--sig)}
#vitro-mc.lt .menu{background:rgba(250,251,253,.85); border-color:rgba(40,50,80,.15)}
#vitro-mc .menu.open{opacity:1; visibility:visible; pointer-events:auto; transform:none}
#vitro-mc .mi{display:flex; align-items:center; gap:7px; width:100%; text-align:left; border:0; background:none; border-radius:7px; padding:6px 10px; cursor:pointer; font-size:12.5px; color:inherit}
#vitro-mc .mi:hover{background:rgba(90,130,230,.55)}
#vitro-mc .mi .chk{width:13px; color:var(--acc)}
#vitro-mc .mi .sa{margin-left:auto; color:var(--mut); font-size:10px}
#vitro-mc .msep{height:1px; background:var(--line); margin:4px 8px}
#vitro-mc .thmb{display:flex; gap:8px; padding:6px}
#vitro-mc .thmb .t{width:74px; height:48px; border-radius:6px; background:linear-gradient(150deg,#3d4a68,#222a3e); border:1px solid rgba(255,255,255,.14); cursor:pointer}
#vitro-mc .thmb .t:hover{outline:2px solid var(--acc)}
#vitro-mc .ovl{position:absolute; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
  background:rgba(5,8,15,.4); opacity:0; visibility:hidden; transition:all .2s}
#vitro-mc .ovl.open{opacity:1; visibility:visible}
#vitro-mc .dlg{width:min(90%,450px); max-height:84%; overflow:auto; border-radius:16px; background:rgba(26,32,48,.95); border:1px solid rgba(255,255,255,.13); box-shadow:0 30px 80px rgba(0,0,0,.55)}
#vitro-mc.lt .dlg{background:rgba(250,251,253,.96); border-color:rgba(40,50,80,.16)}
#vitro-mc .dlg-h{display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line)}
#vitro-mc .dlg-h b{font-weight:500} #vitro-mc .dlg-h .x{margin-left:auto; border:0; background:none; cursor:pointer; color:var(--mut); font-size:15px; padding:2px 6px}
#vitro-mc .tabs{display:flex; gap:4px; padding:8px 12px 0}
#vitro-mc .tab{border:0; background:none; padding:6px 11px; border-radius:8px 8px 0 0; cursor:pointer; font-size:12.5px; color:var(--mut); border-bottom:2px solid transparent}
#vitro-mc .tab.on{color:var(--txt); border-bottom-color:var(--acc)}
#vitro-mc .dlg-b{padding:12px 16px 16px}
#vitro-mc .row{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
#vitro-mc .row label{font-size:12.5px; min-width:130px; color:inherit}
#vitro-mc .row output{font-size:12px; color:var(--mut); min-width:48px}
#vitro-mc .row code{font-family:ui-monospace,Consolas,monospace; font-size:10.5px; color:#8fb7e8; background:rgba(90,130,230,.1); border-radius:5px; padding:1px 5px}
#vitro-mc input[type=range]{appearance:none; width:160px; height:4px; border-radius:2px; background:rgba(128,140,165,.4); cursor:pointer}
#vitro-mc input[type=range]::-webkit-slider-thumb{appearance:none; width:14px; height:14px; border-radius:50%; background:#4a8df0}
#vitro-mc select{font:inherit; font-size:12.5px; color:inherit; background:rgba(128,140,165,.18); border:1px solid var(--line); border-radius:7px; padding:4px 8px}
#vitro-mc .layrow{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:12.5px}
#vitro-mc .layrow b{font-weight:500; min-width:96px}
#vitro-mc .layrow span{color:var(--mut); font-size:11.5px; flex:1}
#vitro-mc .graindemo{width:54px; height:22px; border-radius:5px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>"); background-size:54px}
/* Tahoe 悬浮材质(2025 Liquid Glass 官方化:更少填充、更强边缘、悬浮) */
#vitro-mc.tahoe .dock{background:rgba(255,255,255,.09); backdrop-filter:blur(26px) saturate(1.15)}
#vitro-mc.dk.tahoe .dock{background:rgba(0,0,0,.12); backdrop-filter:blur(28px) saturate(1.12)}
#vitro-mc.tahoe .dock::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.06), inset 0 0 0 .5px rgba(255,255,255,.09)}
#vitro-mc.dk.tahoe .dock::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.20), inset 0 0 0 .5px rgba(255,255,255,.06)}
#vitro-mc.tahoe[data-pos="bottom"] .dockwrap{bottom:24px}
/* 窗口实时预览(MyDockFinder 对标:悬停运行图标) */
#vitro-mc .prev{position:absolute; z-index:45; width:var(--pw,180px); border-radius:10px; overflow:hidden;
  background:rgba(26,32,48,.92); border:1px solid rgba(255,255,255,.14); box-shadow:0 14px 38px rgba(0,0,0,.45);
  opacity:0; visibility:hidden; transform:translateY(6px); transition:all .18s var(--sig); pointer-events:none}
#vitro-mc.lt .prev{background:rgba(250,251,253,.94); border-color:rgba(40,50,80,.16)}
#vitro-mc .prev.on{opacity:1; visibility:visible; transform:none; pointer-events:auto}
#vitro-mc .prev .ph{display:flex; gap:5px; padding:6px 8px; border-bottom:1px solid var(--line)}
#vitro-mc .prev .ph i{width:8px; height:8px; border-radius:50%; background:#febc2e}
#vitro-mc .prev .pc{height:calc(var(--pw,180px)*.55); background:linear-gradient(160deg,#31405f,#1c2436); position:relative; overflow:hidden}
#vitro-mc.lt .prev .pc{background:linear-gradient(160deg,#e8eef9,#cdd9ec)}
#vitro-mc .prev .pc::after{content:""; position:absolute; inset:14% 18%;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.14) 0 8%, transparent 8% 18%)}
#vitro-mc .prev .cap{font-size:11px; color:var(--mut); padding:5px 8px; cursor:pointer}
#vitro-mc .prev .cap:hover{color:var(--txt)}
/* 图标任务进度条(macOS 复制/下载进度;MyDockFinder 重仓项) */
#vitro-mc .pbar{position:absolute; left:14%; right:14%; bottom:5%; height:7%; min-height:3px; border-radius:3px;
  background:rgba(128,140,165,.45); overflow:hidden; opacity:0; transition:opacity .3s}
#vitro-mc .pbar i{display:block; height:100%; width:0%; background:var(--acc); border-radius:3px; transition:width .24s linear}
#vitro-mc .v-ic.prog .pbar{opacity:1}
#vitro-mc .swatch{display:inline-block; width:14px; height:14px; border-radius:4px; background:var(--acc);
  border:1px solid rgba(128,140,165,.5); vertical-align:-2px}
/* 键盘焦点 */
#vitro-mc .v-ic:focus-visible{outline:2px solid var(--acc); outline-offset:3px; border-radius:12px}
@media (prefers-reduced-motion:reduce){
  #vitro-mc *{animation-duration:.2s!important; animation-timing-function:ease!important}
  #vitro-mc .v-ic .ico,#vitro-mc .dockwrap,#vitro-mc .tip{transition-duration:.2s!important}
}

  /* 壁纸取色动态主题色(Seelen 借鉴:accent 从壁纸提取) */

    else{
      body='<div class="row"><label>增强对比度</label><input type="checkbox" id="pHc"'+(S.hc?' checked':'')+'><span style="font-size:11.5px;color:var(--mut)">背景不透明度→80%,分隔线加粗,指示器增大</span></div>'
      +'<div class="row"><label>减弱动态效果</label><span style="font-size:11.5px;color:var(--mut)">跟随系统 prefers-reduced-motion:弹跳/变形/缩放 → 0.2s 淡入淡出</span></div>'
      +'<div class="row"><label>全键盘控制</label><span style="font-size:11.5px;color:var(--mut)">Tab 聚焦 · Enter 打开 · ←→ 移动</span></div>';}
    openDlg('<div class="dlg-h"><b>桌面与程序坞</b><button type="button" class="x" aria-label="关闭">✕</button></div>'
      +'<div class="tabs">'+tabs.map(function(t){return '<button type="button" class="tab'+(t[0]===tab?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div><div class="dlg-b">'+body+'</div>');
    dlg.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){openProps(t.dataset.tab)})});
    var q=function(i){return dlg.querySelector(i)};
    if(tab==='general'){
      q('#pSize').addEventListener('input',function(){S.iconSize=+this.value; q('#oSize').textContent=S.iconSize+'pt'; applyAll();});
      q('#pPeak').addEventListener('input',function(){S.peak=+this.value; persist();});
      q('#pMag').addEventListener('change',function(){S.mag=this.checked; applyAll();});
      q('#pBounce').addEventListener('change',function(){S.bounce=this.checked; persist();});
      q('#pMin').value=S.mineffect; q('#pMin').addEventListener('change',function(){S.mineffect=this.value; persist();});
      q('#pMi').addEventListener('change',function(){S.minToIcon=this.checked; persist();});
      q('#pRec').addEventListener('change',function(){S.showRecents=this.checked; applyAll();});
      q('#pPos').value=S.pos; q('#pPos').addEventListener('change',function(){S.pos=this.value; applyAll();
        hint('位置 → '+this.value+'(侧边时图标向屏幕外侧偏移)');});
      q('#pPw').addEventListener('input',function(){S.prevSize=+this.value; q('#opPw').textContent=S.prevSize+'px'; applyAll();});
      q('#pPd').addEventListener('input',function(){S.prevDelay=+this.value; q('#opPd').textContent=S.prevDelay+'ms'; persist();});
      q('#pProg').addEventListener('change',function(){S.progDemo=this.checked;
        if(!this.checked&&progEl){progEl.classList.remove('prog'); progV=0;} persist();});
      q('#pWa').addEventListener('change',function(){S.wallAccent=this.checked; applyAll();
        hint('动态主题色 '+(this.checked?'开:accent 已从壁纸提取':'关:恢复默认蓝'));});}
    else if(tab==='adv'){
      q('#pAd').addEventListener('input',function(){S.ahDelay=+this.value; q('#oAd').textContent=S.ahDelay+'s'; persist();});
      q('#pAt').addEventListener('input',function(){S.ahMod=+this.value; q('#oAt').textContent='×'+S.ahMod; applyAll();});
      q('#pMine').value=S.mineffect; q('#pMine').addEventListener('change',function(){S.mineffect=this.value; persist();});
      q('#pRc').addEventListener('input',function(){S.recentsN=+this.value; q('#oRc').textContent=S.recentsN;
        var rec=recents(); if(rec.length>S.recentsN)rec[rec.length-1].remove(); persist();});
      q('#pSp').addEventListener('click',function(){addSpacer();});}
    else{q('#pHc').addEventListener('change',function(){S.hc=this.checked; applyAll();});}}
  function rng(l,id,min,max,step,val,unit){return '<div class="row"><label>'+l+'</label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"><output id="o'+id.slice(1)+'">'+val+unit+'</output></div>'}
  function openDlg(html){dlg.innerHTML=html; ovl.classList.add('open');}
  ovl.addEventListener('pointerdown',function(e){if(e.target===ovl)ovl.classList.remove('open');});
  dlg.addEventListener('click',function(e){if(e.target.classList.contains('x'))ovl.classList.remove('open');});

  /* 键盘:←→ 移动焦点 */
  dock.addEventListener('keydown',function(e){
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
    var btns=Array.from(dock.querySelectorAll('.v-ic:not([hidden])')); var i=btns.indexOf(document.activeElement);
    if(i<0)return; var j=(i+(e.key==='ArrowRight'?1:-1)+btns.length)%btns.length; btns[j].focus(); e.preventDefault();});

  function hint(t){hintEl.innerHTML='<b>最近动作</b>'+t;}
  applyAll();
  window.__mc={S:S, dock:dock, applyAll:applyAll, openProps:openProps, openStack:openStack, addRecent:addRecent, minimize:minimize, lpad:lpad};
})();
</script>
</div>
