      <div class="v-menu" id="vMenu" role="menu" aria-label="Dock 菜单" aria-hidden="true">
        <button type="button" class="v-mi" role="menuitem" id="vMiNew">新建条目</button>
        <button type="button" class="v-mi" role="menuitem" id="vMiReplay">重播入场</button>
      </div>
      <div class="v-toast" id="vToast" role="status" aria-hidden="true"><span class="ok" aria-hidden="true"></span><span id="vToastTxt"></span></div>
    </div>
  </div>
  <div class="v-toml">
    <div class="v-toml-h"><b>effects.toml</b><span>当前选择(实时生成)</span><span class="v-sp"></span><span id="vSaved">已保存</span></div>
    <pre id="vToml" aria-hidden="true"></pre>
  </div>
</div>
<div class="v-sr" id="vLive" aria-live="polite"></div>
<script>
(function(){
  var root=document.getElementById('vitro-fx');
  var SLOTS={
    magnify:{attr:'data-magnify',label:'图标放大联动',hint:'悬停 dock 预览',vals:{falloff:['衰减联动','t.dev#11','gpu'],spring:['宽域弹簧','t.dev#11','gpu'],flat:['单图标','nexus R2','gpu'],off:['关闭','nexus R2','gpu']}},
    launch:{attr:'data-launch',label:'启动效果',hint:'点击图标预览',vals:{boing:['弹跳 Boing','nexus R5','gpu'],teleport:['传送','t.dev#13','raster'],swirl:['旋涡','vitro','gpu'],liquid:['液态流光','Liquid Glass 2025','gpu'],pulse:['脉冲','vitro','gpu'],none:['无','nexus R5','gpu']}},
    attention:{attr:'data-attention',label:'注意力效果',hint:'右上按钮预览',vals:{bounce:['跳动','t.dev#22','gpu'],wiggle:['摇摆','t.dev#12','gpu'],glow:['辉光','vitro','gpu'],jelly:['果冻','squash-stretch','gpu'],ping:['角标弹入','t.dev#03','gpu'],none:['无','vitro','gpu']}},
    drawer:{attr:'data-drawer',label:'抽屉开合',hint:'点 dock 左二磁贴',vals:{cross_blur:['交叉模糊','t.dev#07','raster'],scale_center:['居中缩放','t.dev#06','gpu'],morph:['形态生长','t.dev#20','gpu'],instant:['瞬时','vitro','gpu']}},
    menu:{attr:'data-menu',label:'菜单弹出',hint:'点 ⚙ 磁贴',vals:{origin_grow:['原点生长','t.dev#05','gpu'],morph:['形态','t.dev#20','gpu'],slide:['滑出','vitro','gpu'],instant:['瞬时','vitro','gpu']}},
    tooltip:{attr:'data-tooltip',label:'提示气泡',hint:'悬停图标',vals:{shared_bubble:['共享气泡','t.dev#17','gpu'],per_icon:['独立气泡','vitro','gpu'],off:['关闭','nexus R3','gpu']}},
    reflection:{attr:'data-reflection',label:'图标倒影',hint:'dock 下方',vals:{static:['静止','nexus R10','gpu'],fluid:['流态','nexus R10','raster'],off:['关闭','nexus R10','gpu']}},
    tilt:{attr:'data-tilt',label:'3D 倾斜',hint:'在图标上缓慢划过',vals:{glare:['倾斜+光斑','t.dev#19','gpu'],subtle:['轻倾斜','t.dev#19','gpu'],off:['关闭','vitro','gpu']}},
    confirm:{attr:'data-confirm',label:'确认反馈',hint:'菜单 → 新建条目',vals:{check_draw:['描勾','t.dev#10','gpu'],pop:['粒子礼花','t.dev#23','gpu'],toast:['Toast','t.dev#22','gpu'],none:['无','vitro','gpu']}},
    counter:{attr:'data-counter',label:'数值徽章',hint:'CPU docklet 每 2.4s',vals:{pop_in:['逐字弹入','t.dev#02','gpu'],reel:['滚轮','t.dev#26','js'],plain:['平铺','vitro','gpu']}},
    enter:{attr:'data-enter',label:'Dock 入场',hint:'加载/重播',vals:{rise_stagger:['交错上升','t.dev#18','raster'],zoom_blur:['缩放入场','t.dev#18','raster'],fade:['淡入','vitro','gpu'],none:['无','vitro','gpu']}}
  };
  var state={magnify:'falloff',launch:'boing',attention:'bounce',drawer:'cross_blur',menu:'origin_grow',tooltip:'shared_bubble',reflection:'static',tilt:'glare',confirm:'check_draw',counter:'pop_in',enter:'rise_stagger',lp:false};
  var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function byId(i){return document.getElementById(i)}
  var dock=byId('vDock'), stage=byId('vStage'), tip=byId('vTip'), live=byId('vLive');

  /* ── 恢复上次选择 ── */
  try{
    var ws=window.zcode&&window.zcode.widgetState;
    if(ws&&ws.privateContent){var p=ws.privateContent; Object.keys(state).forEach(function(k){if(p[k]&&k!=='lp')state[k]=p[k];});}
  }catch(e){}
  document.addEventListener('zcode:set_globals',function(ev){
    try{var g=ev.detail&&ev.detail.globals; var p=g&&g.widgetState&&g.widgetState.privateContent;
      if(p){Object.keys(state).forEach(function(k){if(p[k]&&k!=='lp'){state[k]=p[k]; applyAll();}});}
    }catch(e){}
  });
  var saveT=0;
  function persist(){ if(!(window.zcode&&window.zcode.setWidgetState))return; clearTimeout(saveT);
    saveT=setTimeout(function(){ window.zcode.setWidgetState({privateContent:state}).catch(function(){}); },250); }

  /* ── dock 图标 ── */
  var APPS=[['⚙','控制磁贴','ctl'],['⊞','抽屉','draw'],['🧭','浏览器','app'],['✉️','邮件','mail'],['🎵','音乐','app'],['🖥️','终端','app'],['🌐','网络','app'],['🎮','游戏','app'],['📝','笔记','app']];
  var icEls=[], mailEl=null, ctlEl=null, drawEl=null, cpuEl=null;
  APPS.forEach(function(a){
    var b=document.createElement('button'); b.type='button'; b.className='v-ic'; b.dataset.label=a[1]; b.setAttribute('aria-label',a[1]);
    b.innerHTML='<div class="v-tile"><span class="v-glyph">'+a[0]+'</span><span class="v-run" aria-hidden="true"></span><span class="v-badge" aria-hidden="true">1</span></div><div class="v-refl" aria-hidden="true">'+a[0]+'</div>';
    dock.appendChild(b); icEls.push(b);
    if(a[2]==='ctl')ctlEl=b; if(a[2]==='draw')drawEl=b; if(a[2]==='mail')mailEl=b;
  });
  cpuEl=document.createElement('button'); cpuEl.type='button'; cpuEl.className='v-ic'; cpuEl.dataset.label='CPU docklet'; cpuEl.setAttribute('aria-label','CPU 插件');
  cpuEl.innerHTML='<div class="v-tile" style="flex-direction:column"><span class="v-glyph">📊</span><span class="v-num" id="vCpuNum">12</span></div><div class="v-refl" aria-hidden="true">📊</div>';
  dock.appendChild(cpuEl); icEls.push(cpuEl);

  /* ── 设置面板 ── */
  var panel=byId('vPanel');
  Object.keys(SLOTS).forEach(function(slot){
    var meta=SLOTS[slot];
    var d=document.createElement('div'); d.className='v-slot';
    var h=document.createElement('div'); h.className='v-slot-h';
    h.innerHTML='<b>'+meta.label+'</b><span>'+meta.hint+'</span>'; d.appendChild(h);
    var ch=document.createElement('div'); ch.className='v-chips'; ch.setAttribute('role','group'); ch.setAttribute('aria-label',meta.label);
    Object.keys(meta.vals).forEach(function(key){
      var b=document.createElement('button'); b.type='button'; b.className='v-chip'; b.textContent=meta.vals[key][0];
      b.setAttribute('aria-pressed', state[slot]===key?'true':'false');
      b.dataset.slot=slot; b.dataset.key=key;
      b.addEventListener('click',function(){ setSlot(slot,key); });
      ch.appendChild(b);
    });
    d.appendChild(ch); panel.appendChild(d);
  });
  function setSlot(slot,key){
    if(state[slot]===key)return; state[slot]=key; applyAll(); persist();
    live.textContent='已切换 '+SLOTS[slot].label+' = '+SLOTS[slot].vals[key][0];
  }
  function applyAll(){
    Object.keys(SLOTS).forEach(function(s){ root.setAttribute(SLOTS[s].attr, state[s]); });
    root.classList.toggle('lp', !!state.lp);
    panel.querySelectorAll('.v-chip').forEach(function(c){
      c.setAttribute('aria-pressed', state[c.dataset.slot]===c.dataset.key?'true':'false');
    });
    byId('vLp').checked=!!state.lp;
    renderToml(); closeAll();
  }

  /* ── TOML 实时输出 ── */
  function renderToml(){
    var out=['<span class="c"># ~/.vitro/effects.toml(效果目录 v1)</span>','<span class="k">[effects]</span>'];
    Object.keys(SLOTS).forEach(function(s){
      var v=SLOTS[s].vals[state[s]];
      var pad=new Array(Math.max(1,13-s.length)).join(' ');
      out.push('<span class="k">'+s+'</span>'+pad+'= <span class="s">"'+state[s]+'"</span>  <span class="c"># '+v[0]+' · '+v[1]+' · '+v[2]+'</span>');
    });
    if(state.lp)out.push('','<span class="k">[battery]</span>','forced_low_power = <span class="s">true</span>  <span class="c"># 全槽已降级</span>');
    byId('vToml').innerHTML=out.join('\n');
    var sv=byId('vSaved'); sv.textContent='已保存'; clearTimeout(sv._t); sv._t=setTimeout(function(){sv.textContent='';},1200);
  }

  /* ── 放大联动引擎 ── */
  var raf=0, hoverEl=null;
  dock.addEventListener('pointerover',function(e){ var t=e.target.closest('.v-ic'); if(t)hoverEl=t; });
  dock.addEventListener('pointermove',function(e){
    if(state.lp||RM||state.magnify==='off')return;
    dock.classList.remove('settle');
    if(raf)return; raf=requestAnimationFrame(function(){ raf=0; magnify(e.clientX); });
  });
  dock.addEventListener('pointerleave',function(){
    dock.classList.add('settle'); icEls.forEach(function(el){ el.style.transform=''; });
    setTimeout(function(){dock.classList.remove('settle');},560); hideTip();
  });
  function magnify(px){
    var mode=state.magnify;
    icEls.forEach(function(el){
      var r=el.getBoundingClientRect();
      var d=Math.abs(r.left+r.width/2-px), f;
      if(mode==='flat'){ f=(hoverEl===el)?1:0; }
      else{ var R=(mode==='spring')?170:120; f=Math.max(0,1-d/R); f=Math.pow(f,(mode==='spring')?1.25:1.6); }
      var peak=(mode==='spring')?1.45:1.6, lift=(mode==='flat'||mode==='off')?0:10;
      el.style.transform='translateY('+(-lift*f)+'px) scale('+(1+(peak-1)*f)+')';
    });
  }

  /* ── 3D 倾斜 ── */
  icEls.forEach(function(el){
    var tile=el.querySelector('.v-tile');
    el.addEventListener('pointermove',function(e){
      if(state.lp||RM||state.tilt==='off')return;
      var r=tile.getBoundingClientRect();
      var x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
      var max=(state.tilt==='subtle')?4:9;
      tile.style.transform='rotateX('+((0.5-y)*max)+'deg) rotateY('+((x-0.5)*max)+'deg)';
      tile.style.setProperty('--gx',(x*100)+'%'); tile.style.setProperty('--gy',(y*100)+'%');
    });
    el.addEventListener('pointerleave',function(){ tile.style.transform=''; });
  });

  /* ── Tooltip:共享气泡 ── */
  var tipT=0;
  icEls.forEach(function(el){
    el.addEventListener('pointerenter',function(){
      if(state.lp||RM||state.tooltip!=='shared_bubble')return;
      clearTimeout(tipT); tipT=setTimeout(function(){ showTip(el); },80);
    });
  });
  function showTip(el){
    tip.textContent=el.dataset.label;
    var sr=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
    var left=r.left-sr.left+r.width/2-tip.offsetWidth/2;
    tip.style.left=Math.max(6,Math.min(left,sr.width-tip.offsetWidth-6))+'px';
    tip.classList.add('on');
  }
  function hideTip(){ clearTimeout(tipT); tip.classList.remove('on'); }

  /* ── 启动效果 ── */
  icEls.forEach(function(el){
    if(el===ctlEl||el===drawEl)return;
    el.addEventListener('click',function(){
      var k=state.launch; if(k==='none'){ el.classList.add('has-run'); return; }
      var tile=el.querySelector('.v-tile');
      tile.classList.remove('fx-boing','fx-teleport','fx-swirl','fx-liquid','fx-pulse','atn-bounce','atn-wiggle','atn-glow','atn-jelly');
      void tile.offsetWidth; tile.classList.add('fx-'+k);
      tile.addEventListener('animationend',function h(){ tile.removeEventListener('animationend',h);
        tile.classList.remove('fx-'+k); el.classList.add('has-run'); });
      el.classList.add('has-run');
    });
  });

  /* ── 注意力效果 ── */
  byId('vAttn').addEventListener('click',function(){
    var k=state.attention; if(!mailEl)return;
    mailEl.classList.remove('badge-on');
    var tile=mailEl.querySelector('.v-tile');
    tile.classList.remove('atn-bounce','atn-wiggle','atn-glow','atn-jelly','fx-boing','fx-teleport','fx-swirl','fx-liquid','fx-pulse');
    if(k==='none')return;
    void tile.offsetWidth;
    if(k==='ping'){ mailEl.classList.add('badge-on'); setTimeout(function(){mailEl.classList.remove('badge-on');},2200); }
    else tile.classList.add('atn-'+k);
    tile.addEventListener('animationend',function h(){ tile.removeEventListener('animationend',h); tile.classList.remove('atn-'+k); });
  });

  /* ── 抽屉 ── */
  var drawer=byId('vDrawer'), grid=byId('vGrid'), srch=byId('vSrch');
  var G=['🧭 浏览器','✉️ 邮件','🎵 音乐','🖥️ 终端','🌐 网络','🎮 游戏','📝 笔记','⚙️ 设置','📦 文件','🎨 画板','📊 图表','🗂️ 文档'];
  G.forEach(function(s){ var p=s.split(' ');
    var b=document.createElement('button'); b.type='button'; b.className='v-gt'; b.dataset.name=p[1];
    b.innerHTML='<i>'+p[0]+'</i><span>'+p[1]+'</span>'; grid.appendChild(b);
  });
  srch.addEventListener('input',function(){
    var q=srch.value.trim();
    grid.querySelectorAll('.v-gt').forEach(function(t){ t.hidden=q&&t.dataset.name.indexOf(q)<0; });
  });
  function openDrawer(){ closeMenu(); drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false'); setTimeout(function(){srch.focus();},80); }
  function closeDrawer(){ drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); srch.value=''; srch.dispatchEvent(new Event('input')); }
  drawEl.addEventListener('click',function(){ drawer.classList.contains('open')?closeDrawer():openDrawer(); });

  /* ── 菜单(锚定控制磁贴) ── */
  var menu=byId('vMenu');
  function openMenu(){
    closeDrawer();
    var sr=stage.getBoundingClientRect(), r=ctlEl.getBoundingClientRect();
    menu.style.left=Math.max(10,(r.left-sr.left-6))+'px';
    menu.classList.add('open'); menu.setAttribute('aria-hidden','false');
  }
  function closeMenu(){ menu.classList.remove('open'); menu.setAttribute('aria-hidden','true'); }
  ctlEl.addEventListener('click',function(){ menu.classList.contains('open')?closeMenu():openMenu(); });
  byId('vMiReplay').addEventListener('click',function(){ closeMenu(); playEnter(); });
  byId('vMiNew').addEventListener('click',function(){ closeMenu(); addItem(); });

  var POOL=[['📦','归档'],['🎨','画板'],['📊','图表'],['🛠️','工具'],['🧪','实验'],['📷','相册'],['🗂️','文档'],['💡','灵感']];
  var poolI=0;
  function addItem(){
    var a=POOL[poolI++%POOL.length];
    var b=document.createElement('button'); b.type='button'; b.className='v-ic'; b.dataset.label=a[1]; b.setAttribute('aria-label',a[1]);
    b.innerHTML='<div class="v-tile"><span class="v-glyph">'+a[0]+'</span><span class="v-run" aria-hidden="true"></span></div><div class="v-refl" aria-hidden="true">'+a[0]+'</div>';
    dock.insertBefore(b,cpuEl); icEls.push(b); wireIcon(b);
    playEnterOne(b, icEls.length-1);
    var k=state.confirm; if(k==='none')return;
    if(k==='toast'){ toast('已添加 '+a[0]+' '+a[1]); return; }
    var tile=b.querySelector('.v-tile');
    if(k==='check_draw'){
      var sv=document.createElementNS('http://www.w3.org/2000/svg','svg');
      sv.setAttribute('class','c-check'); sv.setAttribute('viewBox','0 0 48 48'); sv.setAttribute('aria-hidden','true');
      sv.innerHTML='<circle cx="24" cy="24" r="19"/><path d="M15 24l6.5 6.5L34 18"/>';
      tile.appendChild(sv); setTimeout(function(){sv.remove();},1700);
    }else if(k==='pop'){
      tile.classList.add('fx-pop'); tile.addEventListener('animationend',function h(){tile.removeEventListener('animationend',h);tile.classList.remove('fx-pop');});
      for(var i=0;i<8;i++){ var s=document.createElement('span'); s.className='pt';
        var ang=(Math.PI*2/8)*i, d=18+Math.random()*10;
        s.style.setProperty('--px',(Math.cos(ang)*d)+'px'); s.style.setProperty('--py',(Math.sin(ang)*d)+'px');
        b.appendChild(s); (function(sp){setTimeout(function(){sp.remove();},700);})(s);
      }
    }
  }
  function wireIcon(b){
    b.addEventListener('click',function(){
      var k=state.launch; if(k==='none'){b.classList.add('has-run');return;}
      var tile=b.querySelector('.v-tile'); void tile.offsetWidth; tile.classList.add('fx-'+k);
      tile.addEventListener('animationend',function h(){tile.removeEventListener('animationend',h);tile.classList.remove('fx-'+k);});
      b.classList.add('has-run');
    });
    var tile=b.querySelector('.v-tile');
    b.addEventListener('pointermove',function(e){
      if(state.lp||RM||state.tilt==='off')return;
      var r=tile.getBoundingClientRect(); var x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
      var max=(state.tilt==='subtle')?4:9;
      tile.style.transform='rotateX('+((0.5-y)*max)+'deg) rotateY('+((x-0.5)*max)+'deg)';
      tile.style.setProperty('--gx',(x*100)+'%'); tile.style.setProperty('--gy',(y*100)+'%');
    });
    b.addEventListener('pointerleave',function(){tile.style.transform='';});
    b.addEventListener('pointerenter',function(){
      if(state.lp||RM||state.tooltip!=='shared_bubble')return;
      clearTimeout(tipT); tipT=setTimeout(function(){showTip(b);},80);
    });
  }
  var toastEl=byId('vToast'), toastT=0;
  function toast(msg){
    byId('vToastTxt').textContent=msg;
    toastEl.classList.add('on'); toastEl.setAttribute('aria-hidden','false');
    clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove('on'); toastEl.setAttribute('aria-hidden','true'); },2300);
  }

  /* ── 入场 ── */
  function playEnter(){ icEls.forEach(function(el,i){ playEnterOne(el,i); }); }
  function playEnterOne(el,i){
    el.style.setProperty('--i',i); el.classList.remove('e-in'); void el.offsetWidth; el.classList.add('e-in');
  }
  byId('vReplay').addEventListener('click',playEnter);

  /* ── CPU docklet 徽章 ── */
  var cpuNum=byId('vCpuNum');
  function setCpu(v){
    var s=String(v), k=state.counter;
    if(state.lp||RM)k='plain';
    if(k==='plain'){ cpuNum.textContent=s; return; }
    if(k==='pop_in'){ cpuNum.innerHTML='';
      for(var i=0;i<s.length;i++){ var sp=document.createElement('span'); sp.className='ch'; sp.style.setProperty('--i',i); sp.textContent=s[i]; cpuNum.appendChild(sp); }
      return; }
    /* reel 滚轮(轻量版:旧值上收、新值下入 + 运动模糊) */
    var old=cpuNum.querySelector('.rl:not(.out)');
    if(old)old.classList.add('out');
    var n=document.createElement('span'); n.className='rl'; n.textContent=s;
    n.style.transform='translateY(100%)'; cpuNum.appendChild(n);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      n.style.transform='translateY(0)'; n.classList.add('roll');
      if(old){ old.style.transform='translateY(-100%)'; old.classList.add('roll'); }
      setTimeout(function(){ n.classList.remove('roll'); if(old)old.remove(); },440);
    });});
  }
  setInterval(function(){ setCpu(8+Math.floor(Math.random()*88)); },2400);

  /* ── 省电开关 ── */
  byId('vLp').addEventListener('change',function(e){ state.lp=e.target.checked; applyAll(); persist();
    live.textContent=state.lp?'省电动效:全部效果已降级':'省电动效:已恢复完整效果'; });

  /* ── 点击空白关闭 / Esc ── */
  stage.addEventListener('pointerdown',function(e){
    if(menu.classList.contains('open')&&!menu.contains(e.target)&&e.target!==ctlEl&&!ctlEl.contains(e.target))closeMenu();
    if(drawer.classList.contains('open')&&!drawer.contains(e.target)&&e.target!==drawEl&&!drawEl.contains(e.target))closeDrawer();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){closeMenu();closeDrawer();} });
  function closeAll(){ if(menu.classList.contains('open'))closeMenu(); if(drawer.classList.contains('open'))closeDrawer(); }

  applyAll(); playEnter(); setCpu(12);
})();
</script>
</div>
