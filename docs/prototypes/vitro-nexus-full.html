<div id="vitro-nx" data-pos="bottom">
<style>
#vitro-nx{
  --sig:cubic-bezier(0.22,1,0.36,1); --spring:cubic-bezier(0.34,3.85,0.64,1);
  --txt:#e9edf7; --mut:#98a1b6; --acc:#7fa4ff; --line:rgba(255,255,255,.09);
  --glass:rgba(22,26,38,.62); --anim:1; --blur:20;
  font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--txt); font-size:14px; line-height:1.45;
}
#vitro-nx *{box-sizing:border-box; margin:0}
#vitro-nx button{font:inherit; color:inherit}
#vitro-nx .app{border:1px solid var(--line); border-radius:18px; overflow:hidden; background:#0b0e17; box-shadow:0 24px 70px rgba(0,0,0,.5)}
#vitro-nx .head{display:flex; align-items:center; gap:14px; padding:11px 16px; border-bottom:1px solid var(--line); background:linear-gradient(rgba(255,255,255,.03),transparent); flex-wrap:wrap}
#vitro-nx .dots{display:flex; gap:6px} #vitro-nx .dots i{width:11px;height:11px;border-radius:50%}
#vitro-nx .dots i:first-child{background:#ff5f57}#vitro-nx .dots i:nth-child(2){background:#febc2e}#vitro-nx .dots i:nth-child(3){background:#28c840}
#vitro-nx .ttl{font-weight:500} #vitro-nx .ttl small{color:var(--mut); font-weight:400; margin-left:8px}
#vitro-nx .head .sp{flex:1}
#vitro-nx .sw{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mut); cursor:pointer; user-select:none}
#vitro-nx .sw input{appearance:none; width:32px; height:18px; border-radius:9px; background:rgba(255,255,255,.14); position:relative; cursor:pointer; transition:background .2s var(--sig); margin:0}
#vitro-nx .sw input::after{content:""; position:absolute; top:2.5px; left:3px; width:13px; height:13px; border-radius:50%; background:#fff; transition:transform .2s var(--sig)}
#vitro-nx .sw input:checked{background:#e8b84b} #vitro-nx .sw input:checked::after{transform:translateX(13px)}
#vitro-nx .hbtn{border:1px solid var(--line); background:rgba(255,255,255,.06); border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; transition:all .15s var(--sig)}
#vitro-nx .hbtn:hover{background:rgba(255,255,255,.12)}
/* ── 舞台 ── */
#vitro-nx .stage{position:relative; min-height:600px; overflow:hidden;
  background:radial-gradient(60% 45% at 18% 8%, rgba(63,81,180,.4), transparent 70%),
    radial-gradient(55% 50% at 85% 90%, rgba(122,59,143,.32), transparent 70%),
    radial-gradient(40% 35% at 70% 15%, rgba(34,120,160,.18), transparent 70%), linear-gradient(#0d1322,#080a12)}
#vitro-nx .win{position:absolute; left:50%; top:34px; transform:translateX(-50%); width:min(58%,400px); height:42%;
  border:1px solid var(--line); border-radius:12px; background:rgba(16,20,31,.55); backdrop-filter:blur(4px); box-shadow:0 16px 44px rgba(0,0,0,.36); z-index:8}
#vitro-nx .win::before{content:""; position:absolute; inset:0 0 auto 0; height:28px; border-bottom:1px solid var(--line); background:linear-gradient(rgba(255,255,255,.045),transparent)}
#vitro-nx .wbtns{position:absolute; top:7px; left:12px; z-index:2}
#vitro-nx .wbtns button{border:0; background:none; padding:0; cursor:pointer}
#vitro-nx .wbtns i{width:12px; height:12px; border-radius:50%; display:block; background:#febc2e}
#vitro-nx .wcap{position:absolute; top:8px; left:50px; font-size:11px; color:var(--mut)}
#vitro-nx .win.minning{transition:transform calc(.5s*var(--anim)) var(--sig), opacity calc(.5s*var(--anim)) var(--sig); transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(.05)!important; opacity:.1}
#vitro-nx .win.minned{display:none}
/* 应用库 */
#vitro-nx .tray{position:absolute; left:14px; top:14px; z-index:15; width:150px; padding:10px; border-radius:14px;
  background:var(--glass); backdrop-filter:blur(14px); border:1px solid var(--line); box-shadow:0 12px 34px rgba(0,0,0,.4)}
#vitro-nx .tray b{font-size:11px; color:var(--mut); font-weight:500; display:block; margin-bottom:6px}
#vitro-nx .tray em{font-size:10.5px; color:var(--mut); font-style:normal; display:block; margin-bottom:6px}
#vitro-nx .t-chip{display:flex; align-items:center; gap:7px; width:100%; border:0; border-radius:9px; background:rgba(255,255,255,.05); padding:3px 7px 3px 3px; cursor:grab; transition:background .15s; text-align:left}
#vitro-nx .t-chip:hover{background:rgba(255,255,255,.12)}
#vitro-nx .t-chip svg{width:24px; height:24px; flex:0 0 24px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
#vitro-nx .t-chip span{font-size:12px}
#vitro-nx .tray.pulse{animation:nxPulse 1s var(--sig) 2}
@keyframes nxPulse{50%{box-shadow:0 0 0 4px rgba(127,164,255,.55)}}
/* 状态条 */
#vitro-nx .hint{position:absolute; right:14px; top:14px; z-index:15; max-width:300px; padding:7px 11px; border-radius:11px; font-size:12px; color:#cfe0ff;
  background:var(--glass); backdrop-filter:blur(14px); border:1px solid var(--line)}
#vitro-nx .hint b{display:block; font-size:10.5px; color:var(--mut); font-weight:500}
/* 边缘/角落触发区 */
#vitro-nx .ez{position:absolute; z-index:24; opacity:0}
#vitro-nx .ez[data-side="bottom"]{left:0; right:0; bottom:0; height:14px}
#vitro-nx .ez[data-side="top"]{left:0; right:0; top:0; height:14px}
#vitro-nx .ez[data-side="left"]{left:0; top:0; bottom:0; width:14px}
#vitro-nx .ez[data-side="right"]{right:0; top:0; bottom:0; width:14px}
#vitro-nx .cz{position:absolute; z-index:25; width:26px; height:26px; opacity:0}
#vitro-nx .cz[data-corner="tl"]{left:0; top:0} #vitro-nx .cz[data-corner="tr"]{right:0; top:0}
#vitro-nx .cz[data-corner="bl"]{left:0; bottom:0} #vitro-nx .cz[data-corner="br"]{right:0; bottom:0}
/* 热点按钮 */
#vitro-nx .hotspot{position:absolute; right:18px; bottom:18px; z-index:26; width:30px; height:30px; border-radius:50%;
  border:1px solid rgba(255,255,255,.35); background:radial-gradient(circle at 50% 35%, rgba(127,164,255,.5), rgba(30,50,120,.55));
  box-shadow:0 0 14px rgba(127,164,255,.5); cursor:pointer}
#vitro-nx .hotspot::after{content:""; position:absolute; inset:9px; border-radius:50%; background:#dbe7ff}
/* ── Dock ── */
#vitro-nx .dockwrap{position:absolute; z-index:20; display:flex; transition:transform calc(.4s*var(--anim)) var(--sig)}
#vitro-nx[data-pos="bottom"] .dockwrap{left:0; right:0; bottom:26px; justify-content:center}
#vitro-nx[data-pos="top"] .dockwrap{left:0; right:0; top:26px; justify-content:center}
#vitro-nx[data-pos="left"] .dockwrap{top:0; bottom:0; left:22px; align-items:center}
#vitro-nx[data-pos="right"] .dockwrap{top:0; bottom:0; right:22px; align-items:center}
#vitro-nx.ah[data-pos="bottom"] .dockwrap{transform:translateY(150%)}
#vitro-nx.ah[data-pos="top"] .dockwrap{transform:translateY(-150%)}
#vitro-nx.ah[data-pos="left"] .dockwrap{transform:translateX(-150%)}
#vitro-nx.ah[data-pos="right"] .dockwrap{transform:translateX(150%)}
#vitro-nx .dock{display:flex; align-items:flex-end; gap:9px; padding:9px 12px; border-radius:22px; position:relative;
  background:var(--glass); border:1px solid var(--line);
  backdrop-filter:blur(calc(var(--blur)*1px)) saturate(1.5);
  box-shadow:0 18px 46px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
  transition:border-radius .3s var(--sig)}
#vitro-nx.noblur .dock{backdrop-filter:saturate(1.2)}
#vitro-nx[data-pos="left"] .dock,#vitro-nx[data-pos="right"] .dock{flex-direction:column; align-items:center; padding:12px 9px}
#vitro-nx .v-ic{appearance:none; border:0; background:none; padding:0; position:relative; width:var(--isz,56px); height:var(--isz,56px); cursor:pointer; transition:transform calc(.16s*var(--anim)) var(--sig)}
#vitro-nx .dock.settle .v-ic{transition:transform calc(.5s*var(--anim)) var(--spring)}
#vitro-nx .v-ico{display:block; width:100%; height:100%}
#vitro-nx .v-ico svg{width:100%; height:100%; display:block}
#vitro-nx .shadows-on .v-ico svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#vitro-nx .v-ico.fx-boing{animation:nxBoing calc(.6s*var(--anim)) var(--spring)}
#vitro-nx .attn .v-ico{animation:nxBounce 1.05s var(--sig) 2}
#vitro-nx .v-dot{position:absolute; left:50%; bottom:-8px; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:#fff; opacity:0; box-shadow:0 0 5px rgba(255,255,255,.85); transition:opacity .3s}
#vitro-nx[data-pos="left"] .v-dot,#vitro-nx[data-pos="right"] .v-dot{left:auto; right:-8px; top:50%; bottom:auto; transform:translateY(-50%)}
#vitro-nx .v-ic.has-run .v-dot{opacity:.95}
#vitro-nx .v-badge{position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:#ff5f6d; color:#fff; font-size:10px; line-height:16px; font-weight:500; opacity:0; transform:scale(.4); transition:all .4s}
#vitro-nx .v-ic.badge-on .v-badge{opacity:1; transform:scale(1)}
#vitro-nx .v-pin{position:absolute; top:-3px; left:-3px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:9px solid var(--acc); opacity:0; transition:opacity .3s; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#vitro-nx .v-ic.pinned .v-pin{opacity:1}
#vitro-nx .v-refl{position:absolute; top:calc(100% + 12px); left:0; width:100%; height:70%; opacity:.2; pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.65), transparent 58%); mask-image:linear-gradient(to bottom, rgba(0,0,0,.65), transparent 58%)}
#vitro-nx .v-refl svg{width:100%; height:100%; transform:scaleY(-1); display:block}
#vitro-nx[data-refl="off"] .v-refl,#vitro-nx.lp .v-refl,#vitro-nx[data-pos="left"] .v-refl,#vitro-nx[data-pos="right"] .v-refl{display:none}
#vitro-nx[data-fluid="on"] .v-refl svg{animation:nxRip calc(3s*var(--anim)) ease-in-out infinite}
@keyframes nxRip{0%,100%{transform:scaleY(-1) skewX(0); opacity:1}35%{transform:scaleY(-1) skewX(1.8deg); opacity:1.15}65%{transform:scaleY(-1) skewX(-1.4deg); opacity:.85}}
#vitro-nx .v-sep{background:rgba(255,255,255,.22); border-radius:1px}
#vitro-nx[data-pos="bottom"] .v-sep,#vitro-nx[data-pos="top"] .v-sep{width:2px; height:calc(var(--isz,48px)*.78); align-self:center; margin:0 3px}
#vitro-nx[data-pos="left"] .v-sep,#vitro-nx[data-pos="right"] .v-sep{height:2px; width:calc(var(--isz,48px)*.78); align-self:center; margin:3px 0}
#vitro-nx .v-ic.ins::before{content:""; position:absolute; background:var(--acc)}
#vitro-nx[data-pos="bottom"] .v-ic.ins::before,#vitro-nx[data-pos="top"] .v-ic.ins::before{left:-7px; top:4px; bottom:4px; width:3px; border-radius:2px}
#vitro-nx[data-pos="left"] .v-ic.ins::before,#vitro-nx[data-pos="right"] .v-ic.ins::before{top:-7px; left:4px; right:4px; height:3px; border-radius:2px}
#vitro-nx .trash-hot svg{filter:drop-shadow(0 0 10px rgba(255,120,110,.9))}
#vitro-nx .dock .ripple{position:absolute; border-radius:50%; border:2px solid rgba(190,215,255,.5); pointer-events:none; animation:nxRip2 .8s var(--sig) forwards}
@keyframes nxRip2{from{opacity:.8; transform:scale(.2)}to{opacity:0; transform:scale(1)}}
#vitro-nx .v-ic.e-in{animation:nxRise calc(.45s*var(--anim)) var(--sig) both}
@keyframes nxRise{from{opacity:0; transform:translateY(14px) scale(.7)}}
/* 抽屉启动器(Launchpad 式,GNOME 抽屉) */
#vitro-nx .lpad{position:absolute; inset:0; z-index:58; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  background:rgba(8,11,20,.55); backdrop-filter:blur(28px); opacity:0; visibility:hidden; transition:opacity .25s var(--sig), visibility 0s .25s}
#vitro-nx .lpad.open{opacity:1; visibility:visible; transition:opacity .25s var(--sig)}
#vitro-nx .lpad input{font:inherit; font-size:13px; width:min(260px,70%); padding:8px 14px; border-radius:11px; text-align:center;
  border:1px solid var(--line); background:rgba(255,255,255,.1); color:var(--txt); outline:none}
#vitro-nx .lpad input::placeholder{color:var(--mut)}
#vitro-nx .lpgrid{display:grid; grid-template-columns:repeat(4,minmax(84px,110px)); gap:16px; padding:0 20px; justify-content:center}
#vitro-nx .lp-it{border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px; padding:6px}
#vitro-nx .lp-it svg{width:56px; height:56px; filter:drop-shadow(0 6px 12px rgba(0,0,0,.45)); transition:transform .18s var(--sig)}
#vitro-nx .lp-it:hover svg{transform:scale(1.1)}
#vitro-nx .lp-it span{font-size:12px; color:var(--txt)}
@media (max-width:640px){#vitro-nx .lpgrid{grid-template-columns:repeat(3,minmax(80px,100px))}}
/* 复刻中心:向导/导入导出/粘贴插件 */
#vitro-nx textarea{font-family:ui-monospace,Consolas,monospace; font-size:11px; line-height:1.5; color:#cfe0ff;
  background:rgba(0,0,0,.32); border:1px solid var(--line); border-radius:10px; padding:9px; width:100%; min-height:130px; resize:vertical; outline:none}
#vitro-nx textarea:focus{border-color:var(--acc)}
#vitro-nx .wz{display:flex; gap:10px; align-items:flex-start}
#vitro-nx .wz-n{flex:0 0 22px; width:22px; height:22px; border-radius:50%; background:rgba(127,164,255,.2); color:var(--acc);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500}
#vitro-nx .wz-b{flex:1; padding-bottom:10px; border-bottom:1px dashed var(--line); margin-bottom:10px}
#vitro-nx .wz-b b{font-size:12.5px; font-weight:500; display:block; margin-bottom:3px}
#vitro-nx .wz-b p{font-size:11.5px; color:var(--mut); margin-bottom:6px}
#vitro-nx .shotprev{max-width:230px; max-height:130px; border-radius:9px; border:1px solid var(--line); display:block; margin-top:6px}
#vitro-nx .upl{position:absolute; inset:7px; display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:12px; line-height:1.3; color:#e8f2ff; word-break:break-all; overflow:hidden}
#vitro-nx .upl.err{color:#ff9d9d; font-size:10.5px}
#vitro-nx .okmsg{font-size:12px; color:#7ce3a5; min-height:16px}
#vitro-nx .errmsg{font-size:12px; color:#ff9d9d; min-height:16px}
@keyframes nxBoing{0%{transform:none}28%{transform:translateY(-30px) scale(1.08)}52%{transform:translateY(1px) scale(.94)}74%{transform:translateY(-9px)}100%{transform:none}}
@keyframes nxBounce{0%,100%{transform:none}20%{transform:translateY(-14px)}40%{transform:none}60%{transform:translateY(-10px)}80%{transform:none}}
#vitro-nx .renaming{position:absolute; inset:0; z-index:5; border:0; border-radius:12px; background:rgba(10,14,24,.92); color:#fff; font-size:12px; padding:4px 8px; outline:2px solid var(--acc)}
/* 时钟 */
#vitro-nx .clk-d{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px}
#vitro-nx .clk-d b{font-size:15px; font-weight:500; letter-spacing:.02em; font-variant-numeric:tabular-nums}
#vitro-nx .clk-d span{font-size:8.5px; color:#c9d6ee}
#vitro-nx[data-pos="left"] .clk-d,#vitro-nx[data-pos="right"] .clk-d{transform:rotate(90deg)}
/* RAM 直方图 */
#vitro-nx .ram{position:absolute; left:8px; right:8px; bottom:9px; top:auto; height:16px; display:flex; align-items:flex-end; gap:2px}
#vitro-nx .ram i{flex:1; background:linear-gradient(#9fe8ff,#4aa8e8); border-radius:1px; min-height:2px}
/* 电池 */
#vitro-nx .bat{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
#vitro-nx .bat b{font-size:14px; font-weight:500; font-variant-numeric:tabular-nums}
/* 任务/托盘 docklet 徽点 */
#vitro-nx .mini{position:absolute; bottom:4px; left:0; right:0; display:flex; justify-content:center; gap:2px}
#vitro-nx .mini i{width:5px; height:5px; border-radius:50%; background:#bfe0ff}
/* Shelf 搁架 */
#vitro-nx .shelf{position:absolute; right:0; top:16%; z-index:18; width:150px; max-height:66%; display:flex;
  transform:translateX(calc(100% - 34px)); transition:transform calc(.35s*var(--anim)) var(--sig)}
#vitro-nx .shelf:hover,#vitro-nx .shelf.open{transform:none}
#vitro-nx .shelf-tab{flex:0 0 34px; border:0; background:linear-gradient(180deg, rgba(90,120,200,.6), rgba(40,55,110,.6)); border-left:1px solid var(--line);
  border-radius:12px 0 0 12px; cursor:pointer; color:#dfe8ff; font-size:11px; writing-mode:vertical-rl; letter-spacing:.35em; padding:10px 0}
#vitro-nx .shelf-body{flex:1; overflow:hidden; background:var(--glass); backdrop-filter:blur(18px); border:1px solid var(--line); border-right:0; border-radius:14px 0 0 14px; padding:10px 8px; display:flex; flex-direction:column; gap:6px}
#vitro-nx .shelf-body b{font-size:10.5px; color:var(--mut); font-weight:500}
#vitro-nx .shelf.hot .shelf-body{outline:2px solid var(--acc); outline-offset:-2px}
#vitro-nx .sh-item{display:flex; align-items:center; gap:6px; border:0; background:rgba(255,255,255,.05); border-radius:9px; padding:3px 6px 3px 3px; cursor:grab; text-align:left}
#vitro-nx .sh-item:hover{background:rgba(255,255,255,.12)}
#vitro-nx .sh-item svg{width:22px; height:22px; flex:0 0 22px}
#vitro-nx .sh-item span{font-size:11.5px}
#vitro-nx .sh-empty{font-size:10.5px; color:var(--mut)}
/* 浮动子码头(Detach) */
#vitro-nx .floatdock{position:absolute; z-index:30; display:flex; gap:7px; padding:8px 10px; border-radius:16px;
  background:var(--glass); backdrop-filter:blur(18px); border:1px solid var(--line); box-shadow:0 14px 40px rgba(0,0,0,.5)}
#vitro-nx .floatdock .v-ic{width:44px; height:44px}
/* ── 菜单/弹出 ── */
#vitro-nx .menu{position:absolute; z-index:60; min-width:172px; padding:5px; border-radius:13px;
  background:var(--glass); backdrop-filter:blur(calc(var(--blur)*1px)) saturate(1.5); border:1px solid var(--line);
  box-shadow:0 18px 48px rgba(0,0,0,.5); opacity:0; visibility:hidden; pointer-events:none; transform-origin:bottom left;
  transform:scale(.94) translateY(5px); transition:opacity calc(.25s*var(--anim)) var(--sig), transform calc(.25s*var(--anim)) var(--sig), visibility 0s calc(.25s*var(--anim))}
#vitro-nx .menu.open{opacity:1; visibility:visible; pointer-events:auto; transform:none; transition:opacity calc(.25s*var(--anim)) var(--sig), transform calc(.25s*var(--anim)) var(--sig), visibility 0s 0s}
#vitro-nx .mi{display:flex; align-items:center; gap:7px; width:100%; text-align:left; border:0; background:none; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12.5px; transition:background .13s}
#vitro-nx .mi:hover{background:rgba(255,255,255,.09)}
#vitro-nx .mi[aria-disabled="true"]{opacity:.45; cursor:default}
#vitro-nx .mi .chk{width:14px; flex:0 0 14px; font-size:11px; color:var(--acc)}
#vitro-nx .mi .sub-a{margin-left:auto; color:var(--mut); font-size:10px}
#vitro-nx .msep{height:1px; background:var(--line); margin:4px 8px}
#vitro-nx .fly{position:absolute; z-index:62; padding:12px; border-radius:14px; min-width:180px;
  background:var(--glass); backdrop-filter:blur(18px) saturate(1.5); border:1px solid var(--line); box-shadow:0 18px 48px rgba(0,0,0,.5);
  opacity:0; visibility:hidden; pointer-events:none; transform:translateY(8px) scale(.97); transition:all calc(.25s*var(--anim)) var(--sig)}
#vitro-nx .fly.open{opacity:1; visibility:visible; pointer-events:auto; transform:none}
#vitro-nx .fly h5{font-size:11px; color:var(--mut); font-weight:500; margin-bottom:7px}
#vitro-nx .mailrow{display:flex; gap:8px; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--line); font-size:12px}
#vitro-nx .mailrow:last-child{border-bottom:0}
#vitro-nx .mailrow b{font-weight:500; flex:1}
#vitro-nx .mailrow span{color:var(--mut); font-size:10.5px}
#vitro-nx .fc-day{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px}
#vitro-nx .fc-day em{font-style:normal; color:var(--mut); width:34px; font-size:11px}
#vitro-nx .trayico{display:flex; gap:12px; align-items:center; padding:4px}
#vitro-nx .trayico svg{width:22px; height:22px}
/* ── 对话框 ── */
#vitro-nx .ovl{position:absolute; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
  background:rgba(5,8,15,.45); opacity:0; visibility:hidden; transition:all .25s var(--sig)}
#vitro-nx .ovl.open{opacity:1; visibility:visible}

    b._uplTimers=timers;
    var api={ name:name,
      set:function(h){ body.classList.remove('err'); body.innerHTML=String(h).slice(0,160); },
      every:function(ms,fn){ var t=setInterval(fn,Math.max(250,ms|0)); timers.push(t); try{fn()}catch(e){} return t; } };
    try{ new Function('api',code)(api); }
    catch(e){ body.classList.add('err'); body.textContent='⚠ '+String(e&&e.message||'运行错误').slice(0,60); }
    if(typeof fitDock==='function')fitDock();

      apps.push({app:it.dataset.app,name:it.dataset.name,pin:it.classList.contains('pinned')}); it=it.nextSibling; }
    var it2=sepMain.nextSibling;
    while(it2&&it2!==sepDl){ if(it2.classList&&it2.classList.contains('v-ic')) subs.push(it2.dataset.app); it2=it2.nextSibling; }
    var cfg={vitro:1, name:'我的 Vitro 布置',
      dock:{pos:S.pos,iconSize:S.iconSize,peak:S.peak,blur:S.blur,refl:S.refl,fluid:S.fluid,attention:S.attention,boing:S.boing,autohide:S.autohide},
      apps:apps, subs:subs, docklets:S.docklets,

  function rebuildFromConfig(cfg){
    Array.prototype.slice.call(dock.children).forEach(function(el){
      if(el===ctlEl||el===drawEl||el===sepMain||el===sepDl||el===trashEl)return;
      if(el.classList&&el.classList.contains('docklet')&&!el.classList.contains('upl-item'))return;
      if(el.classList&&el.classList.contains('upl-item')&&el._uplTimers)el._uplTimers.forEach(clearInterval);
      el.remove();});
    (cfg.apps||[]).forEach(function(a){
      var known=!!SQ[a.app];
      var b=mk(known?a.app:'doc',{name:a.name||a.app});
      if(!known)b.dataset.app=a.app;
      if(a.pin)b.classList.add('pinned');
      dock.insertBefore(b,sepMain); wire(b); b.classList.add('e-in');});
    (cfg.subs||[]).forEach(function(id){
      var b=mk(SQ[id]?id:'menulist',{name:SQ[id]?(NAMES[id]||id):id});
      dock.insertBefore(b,sepDl); wire(b); b.classList.add('e-in');});
    if(cfg.docklets){Object.keys(cfg.docklets).forEach(function(k){
      if(!(k in S.docklets))return;
      S.docklets[k]=!!cfg.docklets[k];
      if(S.docklets[k]&&!dockletEls[k]&&['net','cal','clip'].indexOf(k)>=0)ensureDocklet(k);
      if(dockletEls[k])dockletEls[k].hidden=!S.docklets[k];});}
    removeUserPlugins();
    (cfg.custom||[]).forEach(function(p){installUserPlugin(p.name,p.code);});
    S.customPlugins=cfg.custom||[];
    if(cfg.dock){['pos','iconSize','peak','blur','refl','fluid','attention','boing','autohide'].forEach(function(k){
      if(cfg.dock[k]!==undefined)S[k]=cfg.dock[k];});}
    /* 顺序规范化:drawer | apps | sepMain | subs | sepDl | docklets(含用户插件) | trash */
    var appsN=[], subsN=[], dlN=[];
    Array.prototype.slice.call(dock.children).forEach(function(el){
      if(el===ctlEl||el===drawEl||el===sepMain||el===sepDl||el===trashEl)return;
      if(el.classList&&el.classList.contains('docklet'))dlN.push(el);
      else if(el.classList&&el.classList.contains('v-sep'))return;
      else if(el.classList&&el.classList.contains('spacer'))return;
      else if(subsN.length||false){}
      else appsN.push(el);});
    /* 重新识别 subs:sepMain 与 sepDl 之间的现有节点已被收集进 appsN,改用位置判断 */
    appsN=[]; subsN=[]; var zone=0;
    Array.prototype.slice.call(dock.children).forEach(function(el){
      if(el===sepMain){zone=1;return;} if(el===sepDl){zone=2;return;}
      if(el===ctlEl||el===drawEl||el===trashEl)return;
      if(el.classList&&el.classList.contains('docklet')){dlN.push(el);return;}
      if(el.classList&&(el.classList.contains('v-sep')||el.classList.contains('spacer')))return;
      if(zone===0)appsN.push(el); else if(zone===1)subsN.push(el);});
    appsN.forEach(function(n){dock.appendChild(n)});
    dock.appendChild(sepMain);
    subsN.forEach(function(n){dock.appendChild(n)});
    dock.appendChild(sepDl);
    dlN.forEach(function(n){dock.appendChild(n)});
    dock.appendChild(trashEl);
    applyAll(); persist();
    setTimeout(function(){dock.querySelectorAll('.e-in').forEach(function(b){b.classList.remove('e-in')})},700);}
